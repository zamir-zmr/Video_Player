<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<title>Video Player</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0f0f0f;--tx:#fff;--mu:#aaa;--ch:#272727;--ch2:#3f3f3f;--red:#f00;--sa:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:Roboto,"Segoe UI",system-ui,Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:var(--tx);background:var(--ch);border:1px solid var(--ch2);border-radius:10px;padding:12px 14px;width:100%;outline:0}
input:focus,select:focus{border-color:#3ea6ff}
select option{background:#212121}
svg{width:24px;height:24px;fill:currentColor;flex:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:var(--sa)}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 12px}
.logo{display:flex;align-items:center;gap:4px;font-weight:700;font-size:21px;letter-spacing:-1.2px}
.logo i{width:32px;height:22px;background:var(--red);border-radius:6px;position:relative;display:inline-block}
.logo i:after{content:"";position:absolute;left:12px;top:5px;border-left:9px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent}
.tabs{display:flex;gap:8px;padding:4px 12px 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:var(--ch);padding:7px 14px;border-radius:9px;font-size:14px;font-weight:500;white-space:nowrap}
.tab.on{background:var(--tx);color:#000}
#feed{flex:1;overflow-y:auto;padding-bottom:12px}
.card{margin-bottom:18px}
.th{position:relative;aspect-ratio:16/9;background:#222;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer}
.th img,.th video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.th .ph{font-size:15px;font-weight:600;color:#fff;text-align:center;width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px}
.ph.fb{background:linear-gradient(135deg,#1877f2,#0b3d91)}.ph.ig{background:linear-gradient(135deg,#f58529,#dd2a7b 50%,#515bd4)}
.dur{position:absolute;right:8px;bottom:10px;background:rgba(0,0,0,.8);font-size:12px;font-weight:500;padding:2px 5px;border-radius:4px}
.pg{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.3)}
.pg b{display:block;height:100%;background:var(--red);width:0}
.meta{display:flex;gap:12px;padding:12px 12px 0}
.av{width:38px;height:38px;border-radius:50%;background:#7b2ff7;display:flex;align-items:center;justify-content:center;font-weight:600;flex:none;text-transform:uppercase}
.ttl{font-size:15px;line-height:1.3;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.st{font-size:12px;color:var(--mu);margin-top:4px}
.acts{display:flex;gap:18px;padding:8px 12px 0 62px;color:#ddd;font-size:13px}
.acts button{display:flex;align-items:center;gap:6px}
.acts svg{width:22px;height:22px}.lk.on{color:#3ea6ff}
.empty{text-align:center;color:var(--mu);padding:60px 24px;line-height:1.5}
.nav{display:flex;align-items:center;justify-content:space-around;border-top:1px solid #272727;padding:6px 0 calc(6px + var(--sb));background:var(--bg)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;min-width:60px}
.nav .plus{width:42px;height:42px;border:2px solid #fff;border-radius:50%;align-items:center;justify-content:center;min-width:0}
.nav .plus svg{width:26px;height:26px}
.nav .me .av{width:26px;height:26px;font-size:12px}
.ov{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column;padding-top:var(--sa)}
.ov.on{display:flex}
.sheet{background:rgba(0,0,0,.6);justify-content:flex-end}
.sheet .box{background:#212121;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + var(--sb));display:flex;flex-direction:column;gap:12px}
.hd{display:flex;align-items:center;gap:8px;padding:8px 6px;font-weight:600;font-size:18px;border-bottom:1px solid #272727}
.hd button{padding:8px}.hd .sp{flex:1}
.body{flex:1;overflow-y:auto;padding:12px}
.btn{background:var(--tx);color:#000;border-radius:22px;padding:11px 18px;font-weight:600;font-size:14px;text-align:center}
.btn.red{background:var(--red);color:#fff}.btn.gh{background:var(--ch);color:#fff}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #1d1d1d}
.row .g{flex:1;min-width:0}.row .n{font-weight:500;word-break:break-word}.row .s{font-size:12px;color:var(--mu);margin-top:2px}
.row .x{color:#ff6b6b;padding:8px}
.lg{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:24px;gap:12px;max-width:420px;width:100%;margin:0 auto}
.lg .logo{font-size:32px;margin-bottom:12px}.lg .logo i{width:48px;height:34px}.lg .logo i:after{left:19px;top:8px;border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent}
.err{color:#ff6b6b;font-size:13px;min-height:18px}
/* player */
.pw{position:relative;background:#000;aspect-ratio:16/9;width:100%;overflow:hidden;flex:none}
.pw.v{aspect-ratio:9/16;width:auto;height:min(56vh,177.78vw);max-width:100%;align-self:center}
.pw iframe,.pw video,.pw #yt{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.pw video{object-fit:contain}
.pw iframe.ig{inset:auto;left:0;top:-56px;height:calc(100% + 220px)}
.pw .tap{position:absolute;inset:0;z-index:2}
.pw .mk{display:none;position:absolute;inset:0;z-index:3;background:#000 center/cover no-repeat;align-items:center;justify-content:center;cursor:pointer}
.pw .mk svg{width:64px;height:64px;background:rgba(0,0,0,.6);border-radius:50%;padding:12px}
.pw.paused .mk{display:flex}
#o-player:fullscreen{padding-top:0;background:#000}
#o-player:fullscreen .hd,#o-player:fullscreen .pinfo,#o-player:fullscreen .cform{display:none}
#o-player:fullscreen .pw,#o-player:fullscreen .pw.v{flex:1;width:100%;max-width:none;height:auto;aspect-ratio:auto;min-height:0}
#o-player:fullscreen .tap,#o-player:fullscreen .mk{display:none!important}
#o-player:fullscreen .pw iframe.ig{top:0;height:100%}
.ctl{display:flex;flex-direction:column;gap:4px;padding:6px 10px;background:#161616}
.ctl .r{display:flex;align-items:center;gap:4px}
.ctl .r button{padding:6px;border-radius:8px;display:flex;align-items:center;gap:2px;font-size:12px}
.ctl input[type=range]{padding:0;border:0;background:none;accent-color:var(--red);height:20px}
.ctl.emb #sk,.ctl.emb .r>:not(#c-fs){display:none}
.ctl.emb .r{justify-content:flex-end}
.tm{font-size:12px;color:#ddd;min-width:92px}
.pinfo{flex:1;overflow-y:auto;padding:12px;min-height:0}
.pinfo h2{font-size:17px;margin:0 0 6px;font-weight:600;line-height:1.3;word-break:break-word}
.pinfo .acts{padding:12px 0 0}
.at{display:flex;gap:8px;margin:14px 0 4px;overflow-x:auto;scrollbar-width:none}
.at button{background:var(--ch);padding:7px 13px;border-radius:9px;font-size:13px;font-weight:500;white-space:nowrap}
.at button.on{background:var(--tx);color:#000}
.cform{display:none;gap:8px;padding:8px 10px calc(8px + var(--sb));border-top:1px solid #272727;background:var(--bg)}
.cform input{padding:10px 14px;border-radius:22px}
.cform .btn{padding:10px 16px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#e8e8e8;color:#000;padding:10px 16px;border-radius:8px;font-size:14px;z-index:300;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
.toast.on{opacity:1}
.lgrow{padding:10px 0;border-bottom:1px solid #1d1d1d;display:flex;gap:12px;align-items:flex-start}
.lgrow .tmx{font-size:13px;color:#7fd1ff;margin-top:3px;font-variant-numeric:tabular-nums}
.bd{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:6px;margin-left:6px;vertical-align:middle;background:#2a2a2a;color:#ddd}
.bd.l{background:#12304d;color:#7fd1ff}.bd.c{background:#2d2a12;color:#ffd75e}.bd.v{background:#1f2f1f;color:#8fe08f}
.cmt{font-size:14px;color:#eee;margin-top:2px;word-break:break-word;white-space:pre-wrap}
/* manage videos */
.vm{background:#181818;border:1px solid #262626;border-radius:14px;padding:12px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.vmh{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--mu)}
.vth{width:72px;aspect-ratio:16/9;border-radius:6px;background:#222;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
.vth img{width:100%;height:100%;object-fit:cover}
.vth.fb{background:linear-gradient(135deg,#1877f2,#0b3d91)}.vth.ig{background:linear-gradient(135deg,#f58529,#dd2a7b 50%,#515bd4)}
.vm label{font-size:11px;color:var(--mu);margin-bottom:-4px}
.vb{display:flex;gap:8px;margin-top:4px}.vb .btn{flex:1;padding:10px 6px}
/* install banner */
.ib{position:fixed;left:10px;right:10px;bottom:calc(10px + var(--sb));z-index:200;background:#14141f;border:1px solid #2a2a3a;border-radius:18px;padding:12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.6);transform:translateY(150%);transition:transform .35s ease;visibility:hidden}
.ib.on{transform:none;visibility:visible}
.ib img{width:52px;height:52px;border-radius:14px;flex:none}
.ib .it{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ib .it b{font-size:15px}.ib .it span{font-size:12px;color:#aaa;line-height:1.25}
.ib .no{color:#bbb;font-weight:600;font-size:13px;padding:8px 6px}
.ib .yes{background:var(--red);color:#fff;font-weight:700;font-size:14px;padding:10px 16px;border-radius:12px}
#ih{z-index:210}
</style>
</head>
<body>
<div id="login" class="ov on" style="z-index:50">
  <div class="lg">
    <div class="logo"><i></i>Video Player</div>
    <input id="lu" placeholder="Username" autocomplete="username" autocapitalize="none" autocorrect="off">
    <input id="lp" type="password" placeholder="Password" autocomplete="current-password">
    <div class="err" id="le"></div>
    <button class="btn red" id="lb" style="width:100%">Sign in</button>
  </div>
</div>

<div id="app">
  <div class="top"><div class="logo"><i></i>YouTube</div></div>

  <div id="feed"></div>
  <div class="nav">
    <button data-n="home"><svg viewBox="0 0 24 24"><path d="M4 21V9l8-6 8 6v12h-6v-7h-4v7z"/></svg>Home</button>

    <button data-n="me" class="me"><span class="av" id="meav"></span>You</button>
  </div>
</div>

<div id="o-player" class="ov">

  <div class="pw" id="pw"></div>

    <input type="range" id="sk" min="0" max="1000" value="0">
    <div class="r">
      <button id="c-rw" aria-label="Back 10s"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>10</button>
      <button id="c-pp" aria-label="Play or pause"></button>
      <button id="c-ff" aria-label="Forward 10s">10<svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/></svg></button>

    </div>
  </div>
  <div class="pinfo" id="pinfo"><div id="pi-top"></div><div class="at" id="atabs"></div><div id="pi-list"></div></div>
  <div class="cform" id="cform"><input id="ci" placeholder="Add a comment..." maxlength="300" autocomplete="off"><button class="btn red" id="cs">Post</button></div>
</div>

<div id="o-logs" class="ov">
  <div class="hd"><button class="bk" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg></button>Activity logs</div>
  <div class="body" id="logs"></div>
</div>

<div id="o-vids" class="ov">
  <div class="hd"><button class="bk" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg></button>Manage videos</div>
  <div class="body">
    <button class="btn red" id="vadd" style="width:100%;margin-bottom:14px">+ Add new video</button>
    <div id="vlist"></div>
  </div>
</div>

<div id="o-mgr" class="ov">
  <div class="hd"><button class="bk" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg></button>Manager</div>
  <div class="body">
    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px">
      <input id="nu" placeholder="New username" autocapitalize="none" autocorrect="off">
      <input id="np" placeholder="New password">
      <div class="err" id="me2"></div>
      <button class="btn red" id="nadd">Create user</button>
      <button class="btn gh" id="nvids">Manage videos</button>
      <button class="btn gh" id="nlogs">Activity logs</button>
      <button class="btn gh" id="nall" style="color:#ff6b6b">Remove all users</button>
    </div>
    <div id="ulist"></div>
  </div>
</div>

<div id="o-add" class="ov sheet"><div class="box">
  <div style="font-weight:600;font-size:17px">Add video link</div>
  <input id="au" placeholder="YouTube, Facebook, Instagram or MP4 link" autocapitalize="none" autocorrect="off">
  <input id="at" placeholder="Title (optional)">
  <select id="ar"><option value="auto">Shape: Auto (Reel/Short = 9:16, else 16:9)</option><option value="9:16">Shape: Vertical 9:16</option><option value="16:9">Shape: Landscape 16:9</option></select>
  <div class="err" id="ae"></div>
  <button class="btn red" id="aok">Add video</button>
  <button class="btn gh bk">Cancel</button>
</div></div>

<div id="o-me" class="ov sheet"><div class="box">
  <div class="row" style="border:0"><span class="av" id="meav2"></span><div class="g"><div class="n" id="mename"></div><div class="s" id="merole"></div></div></div>
  <button class="btn gh mo" id="mvids">Manage videos</button>
  <button class="btn gh mo" id="mgr">Manager panel</button>
  <button class="btn gh mo" id="mlogs">Activity logs</button>
  <button class="btn red" id="out">Log out</button>
  <button class="btn gh bk">Close</button>
</div></div>

<div id="ih" class="ov sheet" style="display:none"><div class="box">
  <div style="font-weight:600;font-size:17px">Install Video Player</div>
  <div id="iht" style="color:#ddd;line-height:1.5;font-size:14px"></div>
  <button class="btn gh" id="ihc">OK</button>
</div></div>

<div class="ib" id="ib">
  <img src="icon-192.png" alt="">
  <div class="it"><b>Video Player</b><span>Install app · fast &amp; works offline</span></div>
  <button class="no" id="inn">Not now</button>
  <button class="yes" id="iy">Install</button>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

const app=initializeApp({apiKey:"AIzaSyBdzrc8lmNbv-7NTl2dy70RWY6Vq0kFqoI",authDomain:"video-player-cf75f.firebaseapp.com",databaseURL:"https://video-player-cf75f-default-rtdb.firebaseio.com",projectId:"video-player-cf75f",storageBucket:"video-player-cf75f.firebasestorage.app",messagingSenderId:"195869648261",appId:"1:195869648261:web:f84082d1d16cd95ae990ec"});
const db=getDatabase(app);

const MGR="zamir",MPW="admin";
const S={user:localStorage.getItem("vp_user")||null,users:{},videos:{},likes:{},views:{},tab:"home",cur:null,ptab:"c",lf:"all",vsig:"",ready:{}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isM=()=>S.user===MGR;
const MO=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const p2=n=>String(n).padStart(2,"0");
function fmt(t){if(!t)return"Time not recorded";const d=new Date(t);let h=d.getHours();const ap=h>=12?"PM":"AM";h=h%12||12;return`${p2(h)}:${p2(d.getMinutes())}:${p2(d.getSeconds())} ${ap} • ${MO[d.getMonth()]} ${p2(d.getDate())}, ${d.getFullYear()}`}
const dshort=t=>{const d=new Date(t);return`${MO[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`};
const dur=s=>{s=Math.max(0,Math.floor(s||0));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?h+":"+p2(m):m)+":"+p2(s%60)};
const kfmt=n=>n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(1)+"K":String(n);
let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2200)}
const IC={like:'<svg viewBox="0 0 24 24"><path d="M1 21h4V9H1zm22-11a2 2 0 0 0-2-2h-6.3l1-4.6v-.3c0-.4-.2-.8-.4-1.1L14.2 1 7.6 7.6C7.2 8 7 8.500 7 9v10a2 2 0 0 0 2 2h9c.8 0 1.500-.5 1.800-1.200l3-7c.1-.3.200-.5.200-.8z"/></svg>',
cm:'<svg viewBox="0 0 24 24"><path d="M21.990 4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v18l4-4h14c1.100 0 2-.9 2-2zM18 14H6v-2h12zm0-3H6V9h12zm0-3H6V6h12z"/></svg>',
play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',pause:'<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>',
vol:'<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.500 3A4.500 4.500 0 0 0 14 7.970v8.050c1.500-.7 2.500-2.200 2.500-4.020z"/></svg>',
mute:'<svg viewBox="0 0 24 24"><path d="M16.500 12A4.500 4.500 0 0 0 14 7.970v2.210l2.450 2.450c.03-.2.050-.4.050-.63zm2.500 0c0 .9-.2 1.800-.5 2.600l1.500 1.500A9 9 0 0 0 21 12c0-4.300-3-7.900-7-8.800v2.100c2.900.9 5 3.500 5 6.700zM4.300 3 3 4.300 7.700 9H3v6h4l5 5v-6.700l4.300 4.300c-.7.5-1.400.9-2.300 1.200v2.100a9 9 0 0 0 3.600-1.800l2.100 2.100 1.300-1.300L12 8zM12 4 9.900 6.100 12 8.200z"/></svg>'};

/* ---------- link parsing ---------- */
function parse(u){
  u=u.trim();let m;
  if(m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/))([\w-]{11})/))return{type:"youtube",id:m[1]};
  if(/facebook\.com|fb\.watch|fb\.com/i.test(u))return{type:"facebook"};
  if(/instagram\.com/i.test(u))return{type:"instagram"};

}
const igEmbed=u=>{const x=u.split("?")[0].replace(/\/$/,"");return x+"/embed"};
const fbEmbed=u=>"https://www.facebook.com/plugins/video.php?show_text=false&href="+encodeURIComponent(u);
const typeLbl={youtube:"YouTube",facebook:"Facebook",instagram:"Instagram",direct:"Video"};
function guessV(u,t){
  if(t==="youtube")return/youtube\.com\/shorts\//i.test(u);
  if(t==="instagram")return!/instagram\.com\/(?:[^/]+\/)?tv\//i.test(u);

}

/* ---------- player ---------- */
let AD=null,iv=null,ytP=null;
function stopPlayer(){
  clearInterval(iv);iv=null;
  try{ytP&&ytP.destroy&&ytP.destroy()}catch(e){}ytP=null;AD=null;
  const pw=$("pw");const v=pw.querySelector("video");if(v){try{v.pause()}catch(e){}}pw.innerHTML="";$("ctl").style.display="none";
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
}
let ytLoad;const loadYT=()=>ytLoad||(ytLoad=new Promise(r=>{if(window.YT&&YT.Player)return r();const s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";window.onYouTubeIframeAPIReady=r;document.head.appendChild(s)}));
function openVideo(id,tab){
  const v=S.videos[id];if(!v)return;
  S.cur=id;S.ptab=tab||"c";go("player");
  const t=Date.now();
  push(ref(db,"views"),{user:S.user,vid:id,title:v.title,ts:t,label:fmt(t)}).catch(()=>{});
  renderPinfo();stopPlayer();
  const pw=$("pw"),ctl=$("ctl"),emb=v.type==="instagram"||v.type==="facebook";
  pw.className="pw"+(isVert(v)?" v":"");
  ctl.classList.toggle("emb",emb);ctl.style.display="flex";
  if(v.type==="instagram"){pw.innerHTML=`<iframe class="ig" src="${esc(igEmbed(v.url))}" allowfullscreen allow="autoplay;encrypted-media;fullscreen"></iframe>`;bindFs();return}
  if(v.type==="facebook"){pw.innerHTML=`<iframe src="${esc(fbEmbed(v.url))}" allowfullscreen allow="autoplay;clipboard-write;encrypted-media;picture-in-picture;web-share;fullscreen"></iframe>`;bindFs();return}
  if(v.type==="direct"){
    pw.innerHTML=`<video playsinline autoplay src="${esc(v.url)}"></video><div class="tap"></div>`;
    const el=pw.querySelector("video");
    el.addEventListener("loadedmetadata",()=>{if(!v.ratio||v.ratio==="auto")pw.classList.toggle("v",el.videoHeight>el.videoWidth)});
    AD={play:()=>el.play(),pause:()=>el.pause(),seek:x=>el.currentTime=x,time:()=>el.currentTime,dur:()=>el.duration||0,mute:m=>el.muted=m,rate:r=>el.playbackRate=r,playing:()=>!el.paused,muted:()=>el.muted};
    el.onerror=()=>toast("Cannot play this link");
    resume(id);bindCtl(id);
  }else{
    pw.classList.add("paused");
    pw.innerHTML=`<div id="yt"></div><div class="mk" style="background-image:url(https://i.ytimg.com/vi/${esc(v.vid)}/hqdefault.jpg)">${IC.play}</div><div class="tap"></div>`;
    loadYT().then(()=>{
      if(S.cur!==id)return;
      ytP=new YT.Player("yt",{videoId:v.vid,playerVars:{controls:0,playsinline:1,rel:0,modestbranding:1,autoplay:1,fs:0,iv_load_policy:3,disablekb:1},events:{
        onReady:()=>{if(S.cur!==id||!ytP)return;AD={play:()=>ytP.playVideo(),pause:()=>ytP.pauseVideo(),seek:x=>ytP.seekTo(x,true),time:()=>ytP.getCurrentTime(),dur:()=>ytP.getDuration(),mute:m=>m?ytP.mute():ytP.unMute(),rate:r=>ytP.setPlaybackRate(r),playing:()=>ytP.getPlayerState()===1,muted:()=>ytP.isMuted()};
          const sp=prog(id);if(sp>0&&sp<.97){const d=ytP.getDuration();if(d)ytP.seekTo(sp*d,true)}
          bindCtl(id);ytP.playVideo()},
        onStateChange:e=>{pw.classList.toggle("paused",e.data!==1&&e.data!==3)},
        onError:()=>toast("This video cannot be played here")}})});
  }
}
function resume(id){const el=$("pw").querySelector("video"),sp=prog(id);el.addEventListener("loadedmetadata",()=>{if(sp>0&&sp<.97)el.currentTime=sp*el.duration},{once:true})}
function bindFs(){$("c-fs").onclick=()=>{const w=$("o-player");document.fullscreenElement?document.exitFullscreen():(w.requestFullscreen||w.webkitRequestFullscreen||(()=>{})).call(w)}}
let rates=[.5,1,1.25,1.5,2],ri=1;
function bindCtl(id){
  ri=1;$("c-sp").textContent="1x";let seeking=false;
  const up=()=>{if(!AD)return;const d=AD.dur(),t=AD.time();
    $("c-pp").innerHTML=AD.playing()?IC.pause:IC.play;$("c-mu").innerHTML=AD.muted()?IC.mute:IC.vol;
    if(d){if(!seeking)$("sk").value=Math.round(t/d*1000);$("tm").textContent=dur(t)+" / "+dur(d);
      const f=Math.min(1,t/d);localStorage.setItem(`vp_p_${S.user}_${id}`,f);
      const dd=document.querySelector(`[data-d="${id}"]`);if(dd&&!dd.textContent)dd.textContent=dur(d);
      const pb=document.querySelector(`.card[data-id="${id}"] .pg b`);if(pb)pb.style.width=f*100+"%"}};
  clearInterval(iv);iv=setInterval(up,400);up();
  const sk=$("sk");
  sk.oninput=()=>{seeking=true;const d=AD&&AD.dur();if(d)$("tm").textContent=dur(sk.value/1000*d)+" / "+dur(d)};
  sk.onchange=()=>{const d=AD&&AD.dur();if(d)AD.seek(sk.value/1000*d);seeking=false};
  const tog=()=>{if(!AD)return;AD.playing()?AD.pause():AD.play();setTimeout(up,150)};
  $("c-pp").onclick=tog;$("pw").querySelector(".tap").onclick=tog;
  const mk=$("pw").querySelector(".mk");if(mk)mk.onclick=tog;
  $("c-rw").onclick=()=>AD&&AD.seek(Math.max(0,AD.time()-10));
  $("c-ff").onclick=()=>AD&&AD.seek(Math.min(AD.dur()||1e9,AD.time()+10));
  $("c-mu").onclick=()=>{if(!AD)return;AD.mute(!AD.muted());setTimeout(up,100)};
  $("c-sp").onclick=()=>{ri=(ri+1)%rates.length;AD&&AD.rate(rates[ri]);$("c-sp").textContent=rates[ri]+"x"};
  bindFs();
}

/* ---------- activity logs ---------- */
function renderLogs(){
  if(!isM()){$("logs").innerHTML='<div class="empty">Only the manager can view activity.</div>';return}
  const A=[];
  for(const k in S.views){const l=S.views[k];A.push({k:"v",user:l.user,title:l.title,ts:l.ts})}
  for(const vid in S.likes){const t=(S.videos[vid]||{}).title||"Deleted video";for(const u in S.likes[vid]){const x=S.likes[vid][u];A.push({k:"l",user:u,title:t,ts:typeof x==="number"?x:0})}}
  for(const vid in S.videos){const c=S.videos[vid].comments;if(c)for(const ck in c)A.push({k:"c",user:c[ck].user,title:S.videos[vid].title,text:c[ck].text,ts:c[ck].ts})}
  const F=[["all","All"],["v","Views"],["l","Likes"],["c","Comments"]];
  const L=A.filter(x=>S.lf==="all"||x.k===S.lf).sort((a,b)=>b.ts-a.ts);
  const lb={v:"Viewed",l:"Liked",c:"Commented"};
  $("logs").innerHTML=`<div class="at" style="margin-top:0">${F.map(([k,l])=>`<button data-lf="${k}" class="${S.lf===k?"on":""}">${l}</button>`).join("")}</div>`+
  (L.length?L.map(l=>`<div class="lgrow"><span class="av">${esc((l.user||"?")[0])}</span><div style="min-width:0"><div class="n" style="font-weight:600">${esc(l.user)}<span class="bd ${l.k}">${lb[l.k]}</span></div><div class="ttl" style="font-size:13px;color:#ddd">${esc(l.title)}</div>${l.text?`<div class="cmt">${esc(l.text)}</div>`:""}<div class="tmx">${esc(fmt(l.ts))}</div></div></div>`).join(""):'<div class="empty">No activity yet.</div>');
}
$("logs").onclick=e=>{const b=e.target.closest("[data-lf]");if(b){S.lf=b.dataset.lf;renderLogs()}};

/* ---------- PWA install popup ---------- */
let dp=null,ibHid=sessionStorage.getItem("vp_ib")==="1";
const standalone=()=>["standalone","fullscreen","minimal-ui"].some(m=>matchMedia(`(display-mode: ${m})`).matches)||navigator.standalone===true;
function showIB(){if(standalone()||ibHid)return;$("ib").classList.add("on")}
function hideIB(){$("ib").classList.remove("on")}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;showIB()});
window.addEventListener("appinstalled",()=>{dp=null;hideIB();toast("App installed")});
$("inn").onclick=()=>{ibHid=true;sessionStorage.setItem("vp_ib","1");hideIB()};
$("iy").onclick=async()=>{
  if(dp){try{dp.prompt();const r=await dp.userChoice;dp=null;if(r.outcome==="accepted")hideIB()}catch(e){}return}
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  $("iht").innerHTML=ios?"Tap the <b>Share</b> button in Safari, then choose <b>Add to Home Screen</b>.":"Open the browser <b>menu (⋮)</b> and tap <b>Install app</b> or <b>Add to Home screen</b>.";
  $("ih").style.display="flex";
};
$("ihc").onclick=()=>{$("ih").style.display="none"};
setTimeout(showIB,1000);

/* ---------- start ---------- */
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
applySession();
</script>
</body>
