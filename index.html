<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<title>Video Player</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0f0f0f;--tx:#fff;--mu:#aaa;--ch:#272727;--ch2:#3f3f3f;--red:#f00;--sa:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:Roboto,"Segoe UI",system-ui,Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:var(--tx);background:var(--ch);border:1px solid var(--ch2);border-radius:10px;padding:12px 14px;width:100%;outline:0}
input:focus{border-color:#3ea6ff}
svg{width:24px;height:24px;fill:currentColor;flex:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:var(--sa)}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 12px}
.logo{display:flex;align-items:center;gap:4px;font-weight:700;font-size:21px;letter-spacing:-1.2px}
.logo i{width:32px;height:22px;background:var(--red);border-radius:6px;position:relative;display:inline-block}
.logo i:after{content:"";position:absolute;left:12px;top:5px;border-left:9px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent}
.tabs{display:flex;gap:8px;padding:4px 12px 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:var(--ch);padding:7px 14px;border-radius:9px;font-size:14px;font-weight:500;white-space:nowrap}
.tab.on{background:var(--tx);color:#000}
#feed{flex:1;overflow-y:auto;padding-bottom:12px}
.card{margin-bottom:18px}
.th{position:relative;aspect-ratio:16/9;background:#222;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer}
.th img,.th video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.th .ph{font-size:15px;font-weight:600;color:#fff;text-align:center;width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px}
.ph.fb{background:linear-gradient(135deg,#1877f2,#0b3d91)}.ph.ig{background:linear-gradient(135deg,#f58529,#dd2a7b 50%,#515bd4)}.ph.mp{background:linear-gradient(135deg,#333,#111)}
.dur{position:absolute;right:8px;bottom:10px;background:rgba(0,0,0,.8);font-size:12px;font-weight:500;padding:2px 5px;border-radius:4px}
.pg{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.3)}
.pg b{display:block;height:100%;background:var(--red);width:0}
.meta{display:flex;gap:12px;padding:12px 12px 0}
.av{width:38px;height:38px;border-radius:50%;background:#7b2ff7;display:flex;align-items:center;justify-content:center;font-weight:600;flex:none;text-transform:uppercase}
.ttl{font-size:15px;line-height:1.3;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.st{font-size:12px;color:var(--mu);margin-top:4px}
.acts{display:flex;gap:18px;padding:8px 12px 0 62px;color:#ddd;font-size:13px}
.acts button{display:flex;align-items:center;gap:6px}
.acts svg{width:22px;height:22px}.lk.on{color:#3ea6ff}
.empty{text-align:center;color:var(--mu);padding:60px 24px;line-height:1.5}
.nav{display:flex;align-items:center;justify-content:space-around;border-top:1px solid #272727;padding:6px 0 calc(6px + var(--sb));background:var(--bg)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;min-width:60px}
.nav .plus{width:42px;height:42px;border:2px solid #fff;border-radius:50%;align-items:center;justify-content:center;min-width:0}
.nav .plus svg{width:26px;height:26px}
.nav .me .av{width:26px;height:26px;font-size:12px}
.ov{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column;padding-top:var(--sa)}
.ov.on{display:flex}
.sheet{background:rgba(0,0,0,.6);justify-content:flex-end}
.sheet .box{background:#212121;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + var(--sb));display:flex;flex-direction:column;gap:12px}
.hd{display:flex;align-items:center;gap:8px;padding:8px 6px;font-weight:600;font-size:18px;border-bottom:1px solid #272727}
.hd button{padding:8px}.hd .sp{flex:1}
.body{flex:1;overflow-y:auto;padding:12px}
.btn{background:var(--tx);color:#000;border-radius:22px;padding:11px 18px;font-weight:600;font-size:14px;text-align:center}
.btn.red{background:var(--red);color:#fff}.btn.gh{background:var(--ch);color:#fff}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #1d1d1d}
.row .g{flex:1;min-width:0}.row .n{font-weight:500;word-break:break-word}.row .s{font-size:12px;color:var(--mu);margin-top:2px}
.row .x{color:#ff6b6b;padding:8px}
.lg{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:24px;gap:12px;max-width:420px;width:100%;margin:0 auto}
.lg .logo{font-size:32px;margin-bottom:12px}.lg .logo i{width:48px;height:34px}.lg .logo i:after{left:19px;top:8px;border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent}
.err{color:#ff6b6b;font-size:13px;min-height:18px}
.pw{position:relative;background:#000;aspect-ratio:16/9;width:100%}
.pw iframe,.pw video,.pw #yt{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.pw .tap{position:absolute;inset:0;z-index:2}
.pw:fullscreen{aspect-ratio:auto;height:100%}
.ctl{display:flex;flex-direction:column;gap:4px;padding:6px 10px;background:#161616}
.ctl .r{display:flex;align-items:center;gap:4px}
.ctl .r button{padding:6px;border-radius:8px;display:flex;align-items:center;gap:2px;font-size:12px}
.ctl input[type=range]{padding:0;border:0;background:none;accent-color:var(--red);height:20px}
.tm{font-size:12px;color:#ddd;min-width:92px}
.pinfo{flex:1;overflow-y:auto;padding:12px}
.pinfo h2{font-size:17px;margin:0 0 6px;font-weight:600;line-height:1.3;word-break:break-word}
.pinfo .acts{padding:12px 0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#e8e8e8;color:#000;padding:10px 16px;border-radius:8px;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
.toast.on{opacity:1}
.lgrow{padding:10px 0;border-bottom:1px solid #1d1d1d;display:flex;gap:12px;align-items:flex-start}
.lgrow .tmx{font-size:13px;color:#7fd1ff;margin-top:3px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="login" class="ov on" style="z-index:50">
  <div class="lg">
    <div class="logo"><i></i>Video Player</div>
    <input id="lu" placeholder="Username" autocomplete="username" autocapitalize="none" autocorrect="off">
    <input id="lp" type="password" placeholder="Password" autocomplete="current-password">
    <div class="err" id="le"></div>
    <button class="btn red" id="lb" style="width:100%">Sign in</button>
  </div>
</div>

<div id="app">
  <div class="top">
    <div class="logo"><i></i>YouTube</div>
    <div style="display:flex;gap:6px"><button id="bell" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4a2 2 0 0 0 2 2zm6-6v-5c0-3.1-1.6-5.6-4.5-6.3V4a1.5 1.5 0 0 0-3 0v.7C7.6 5.4 6 7.9 6 11v5l-2 2v1h16v-1l-2-2z"/></svg></button></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="feed"></div>
  <div class="nav">
    <button data-n="home"><svg viewBox="0 0 24 24"><path d="M4 21V9l8-6 8 6v12h-6v-7h-4v7z"/></svg>Home</button>
    <button data-n="shorts"><svg viewBox="0 0 24 24"><path d="M17.8 8.4 8.6 3.3a3.3 3.3 0 0 0-3.2 5.7l1 .5-1 .5a3.3 3.3 0 0 0 .4 6l9.2 5.1a3.3 3.3 0 0 0 3.2-5.7l-1-.5 1-.5a3.3 3.3 0 0 0-.4-6zM10 14.6V9.4l4.5 2.6z"/></svg>Shorts</button>
    <button data-n="plus" class="plus" aria-label="Add video"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg></button>
    <button data-n="me" class="me"><span class="av" id="meav"></span>You</button>
  </div>
</div>

<div id="o-player" class="ov">
  <div class="hd"><button id="pb" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg></button><span class="sp"></span></div>
  <div class="pw" id="pw"></div>
  <div class="ctl" id="ctl" style="display:none">
    <input type="range" id="sk" min="0" max="1000" value="0">
    <div class="r">
      <button id="c-rw" aria-label="Back 10s"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>10</button>
      <button id="c-pp" aria-label="Play or pause"></button>
      <button id="c-ff" aria-label="Forward 10s">10<svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/></svg></button>
      <span class="tm" id="tm">0:00 / 0:00</span><span style="flex:1"></span>
      <button id="c-sp">1x</button>
      <button id="c-mu" aria-label="Mute"></button>
      <button id="c-fs" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7zm-2-4h2V7h3V5H5zm12 7h-3v2h5v-5h-2zM14 5v2h3v3h2V5z"/></svg></button>
    </div>
  </div>
  <div class="pinfo" id="pinfo"></div>
</div>

<div id="o-logs" class="ov">
  <div class="hd"><button class="bk" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg></button>Watch history</div>
  <div class="body" id="logs"></div>
</div>

<div id="o-mgr" class="ov">
  <div class="hd"><button class="bk" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg></button>Manager</div>
  <div class="body">
    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px">
      <input id="nu" placeholder="New username" autocapitalize="none" autocorrect="off">
      <input id="np" placeholder="New password">
      <div class="err" id="me2"></div>
      <button class="btn red" id="nadd">Create user</button>
      <button class="btn gh" id="nlogs">View watch history</button>
      <button class="btn gh" id="nall" style="color:#ff6b6b">Remove all users</button>
    </div>
    <div id="ulist"></div>
  </div>
</div>

<div id="o-add" class="ov sheet"><div class="box">
  <div style="font-weight:600;font-size:17px">Add video link</div>
  <input id="au" placeholder="YouTube, Facebook, Instagram or MP4 link" autocapitalize="none" autocorrect="off">
  <input id="at" placeholder="Title (optional)">
  <div class="err" id="ae"></div>
  <button class="btn red" id="aok">Add video</button>
  <button class="btn gh bk">Cancel</button>
</div></div>

<div id="o-me" class="ov sheet"><div class="box">
  <div class="row" style="border:0"><span class="av" id="meav2"></span><div class="g"><div class="n" id="mename"></div><div class="s" id="merole"></div></div></div>
  <button class="btn gh" id="mgr">Manager panel</button>
  <button class="btn gh" id="mlogs">Watch history</button>
  <button class="btn red" id="out">Log out</button>
  <button class="btn gh bk">Close</button>
</div></div>

<div class="toast" id="toast"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getDatabase,ref,onValue,set,remove,push,get,update}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const app=initializeApp({apiKey:"AIzaSyBdzrc8lmNbv-7NTl2dy70RWY6Vq0kFqoI",authDomain:"video-player-cf75f.firebaseapp.com",databaseURL:"https://video-player-cf75f-default-rtdb.firebaseio.com",projectId:"video-player-cf75f",storageBucket:"video-player-cf75f.firebasestorage.app",messagingSenderId:"195869648261",appId:"1:195869648261:web:f84082d1d16cd95ae990ec"});
const db=getDatabase(app);
const $=id=>document.getElementById(id);
const MGR="zamir",MPW="admin";
const S={user:localStorage.getItem("vp_user")||null,users:{},videos:{},likes:{},views:{},tab:"home",cur:null,ad:null,ready:{}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isM=()=>S.user===MGR;
const MO=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const p2=n=>String(n).padStart(2,"0");
function fmt(t){const d=new Date(t);let h=d.getHours();const ap=h>=12?"PM":"AM";h=h%12||12;return`${p2(h)}:${p2(d.getMinutes())}:${p2(d.getSeconds())} ${ap} • ${MO[d.getMonth()]} ${p2(d.getDate())}, ${d.getFullYear()}`}
const dshort=t=>{const d=new Date(t);return`${MO[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`};
const dur=s=>{s=Math.max(0,Math.floor(s||0));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?h+":"+p2(m):m)+":"+p2(s%60)};
const kfmt=n=>n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(1)+"K":String(n);
let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2200)}
const IC={like:'<svg viewBox="0 0 24 24"><path d="M1 21h4V9H1zm22-11a2 2 0 0 0-2-2h-6.3l1-4.6v-.3c0-.4-.2-.8-.4-1.1L14.2 1 7.6 7.6C7.2 8 7 8.500 7 9v10a2 2 0 0 0 2 2h9c.8 0 1.500-.5 1.800-1.200l3-7c.1-.3.200-.5.200-.8z"/></svg>',
cm:'<svg viewBox="0 0 24 24"><path d="M21.990 4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v18l4-4h14c1.100 0 2-.9 2-2zM18 14H6v-2h12zm0-3H6V9h12zm0-3H6V6h12z"/></svg>',
del:'<svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6zM19 4h-3.500l-1-1h-5l-1 1H5v2h14z"/></svg>',
play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',pause:'<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>',
vol:'<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.500 3A4.500 4.500 0 0 0 14 7.970v8.050c1.500-.7 2.500-2.200 2.500-4.020z"/></svg>',
mute:'<svg viewBox="0 0 24 24"><path d="M16.500 12A4.500 4.500 0 0 0 14 7.970v2.210l2.450 2.450c.03-.2.050-.4.050-.63zm2.500 0c0 .9-.2 1.800-.5 2.600l1.500 1.500A9 9 0 0 0 21 12c0-4.300-3-7.900-7-8.800v2.100c2.900.9 5 3.500 5 6.700zM4.300 3 3 4.300 7.700 9H3v6h4l5 5v-6.700l4.300 4.300c-.7.5-1.400.9-2.300 1.200v2.100a9 9 0 0 0 3.600-1.800l2.100 2.100 1.300-1.300L12 8zM12 4 9.900 6.100 12 8.200z"/></svg>'};

/* ---------- link parsing ---------- */
function parse(u){
  u=u.trim();let m;
  if(m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/))([\w-]{11})/))return{type:"youtube",id:m[1]};
  if(/facebook\.com|fb\.watch|fb\.com/i.test(u))return{type:"facebook"};
  if(/instagram\.com/i.test(u))return{type:"instagram"};
  return{type:"direct"};
}
const igEmbed=u=>{const x=u.split("?")[0].replace(/\/$/,"");return x+"/embed"};
const fbEmbed=u=>"https://www.facebook.com/plugins/video.php?show_text=false&href="+encodeURIComponent(u);
const typeLbl={youtube:"YouTube",facebook:"Facebook",instagram:"Instagram",direct:"Video"};

/* ---------- history / screens ---------- */
const OV=["player","logs","mgr","add","me"];
function show(s){
  OV.forEach(k=>$("o-"+k).classList.toggle("on",k===s));
  if(s!=="player"){stopPlayer();S.cur=null}
  if(s==="logs")renderLogs();if(s==="mgr")renderMgr();if(s==="me")renderMe();
}
function go(s){history.pushState({s},"");show(s)}
window.addEventListener("popstate",e=>{const s=e.state&&e.state.s;show(s==="player"&&!S.cur?null:s||null)});
history.replaceState({s:null},"");
document.querySelectorAll(".bk").forEach(b=>b.onclick=()=>history.back());
$("pb").onclick=()=>history.back();

/* ---------- auth ---------- */
const loginOv=$("login");
function applySession(){
  const on=!!S.user;
  loginOv.classList.toggle("on",!on);
  if(on){const i=S.user[0];$("meav").textContent=i;$("meav2").textContent=i;renderTabs();render()}
}
async function doLogin(){
  const u=$("lu").value.trim(),p=$("lp").value;$("le").textContent="";
  if(!u||!p){$("le").textContent="Enter username and password.";return}
  try{
    if(u===MGR){if(p!==MPW){$("le").textContent="Wrong username or password.";return}}
    else{const s=await get(ref(db,"users/"+u));if(!s.exists()||s.val().password!==p){$("le").textContent="Wrong username or password.";return}}
    S.user=u;localStorage.setItem("vp_user",u);$("lp").value="";applySession();
  }catch(e){$("le").textContent="Cannot connect. Check internet and database rules."}
}
$("lb").onclick=doLogin;$("lp").onkeydown=e=>{if(e.key==="Enter")doLogin()};
function logout(msg){
  S.user=null;S.cur=null;localStorage.removeItem("vp_user");
  while(history.state&&history.state.s){history.back();break}
  show(null);applySession();if(msg)toast(msg);
}
$("out").onclick=()=>logout("Logged out");

/* ---------- firebase listeners ---------- */
const listen=(k,path)=>onValue(ref(db,path),s=>{S[k]=s.val()||{};S.ready[k]=true;onData(k)},e=>toast("Database error: "+e.code));
listen("users","users");listen("videos","videos");listen("likes","likes");listen("views","views");
function onData(k){
  if(k==="users"&&S.user&&S.user!==MGR&&!S.users[S.user]){logout("Your account was removed");return}
  if(!S.user)return;
  render();
  if($("o-mgr").classList.contains("on"))renderMgr();
  if($("o-logs").classList.contains("on"))renderLogs();
  if(S.cur){if(!S.videos[S.cur])return gone();renderPinfo()}
}
function gone(){toast("Video was removed");S.cur=null;if($("o-player").classList.contains("on"))history.back()}

/* ---------- feed ---------- */
const TABS=[["home","Home"],["subs","Subs"],["music","Music"],["live","Live"],["more","More"]];
function renderTabs(){$("tabs").innerHTML=TABS.map(([k,l])=>`<button class="tab ${S.tab===k?"on":""}" data-t="${k}">${l}</button>`).join("")}
$("tabs").onclick=e=>{const t=e.target.closest("[data-t]");if(!t)return;
  if(t.dataset.t==="more"){go("me");return}
  S.tab=t.dataset.t;renderTabs();render();$("feed").scrollTop=0};
document.querySelector(".nav").onclick=e=>{const b=e.target.closest("[data-n]");if(!b)return;const n=b.dataset.n;
  if(n==="home"){S.tab="home";renderTabs();render();$("feed").scrollTop=0}
  else if(n==="shorts"){S.tab="shorts";renderTabs();render()}
  else if(n==="plus"){if(!isM())toast("Only the manager can add videos");else{$("au").value="";$("at").value="";$("ae").textContent="";go("add")}}
  else if(n==="me")go("me")};
const lkCount=id=>Object.keys(S.likes[id]||{}).length;
const vwCount=id=>{let c=0;for(const k in S.views)if(S.views[k].vid===id)c++;return c};
const prog=id=>parseFloat(localStorage.getItem(`vp_p_${S.user}_${id}`)||0);
function render(){
  if(!S.user)return;
  let list=Object.entries(S.videos).map(([id,v])=>({id,...v})).sort((a,b)=>b.ts-a.ts);
  const t=S.tab;
  if(t==="subs")list=list.filter(v=>S.likes[v.id]&&S.likes[v.id][S.user]);
  if(t==="music")list=list.filter(v=>v.type==="direct");
  if(t==="live")list=list.filter(v=>v.type==="facebook");
  if(t==="shorts")list=list.filter(v=>v.type==="instagram");
  const f=$("feed");
  if(!list.length){f.innerHTML=`<div class="empty">${t==="home"?(isM()?"No videos yet. Tap + to add a link.":"No videos yet. New videos from the manager appear here automatically."):"Nothing here yet."}</div>`;return}
  f.innerHTML=list.map(v=>{
    const liked=!!(S.likes[v.id]&&S.likes[v.id][S.user]),pr=Math.round(prog(v.id)*100);
    let th;
    if(v.type==="youtube")th=`<img loading="lazy" src="https://i.ytimg.com/vi/${esc(v.vid)}/hqdefault.jpg" alt="">`;
    else if(v.type==="direct")th=`<video muted playsinline preload="metadata" src="${esc(v.url)}#t=0.5"></video>`;
    else th=`<div class="ph ${v.type==="facebook"?"fb":"ig"}">${IC.play.replace("<svg","<svg style='width:44px;height:44px'")}${typeLbl[v.type]}</div>`;
    return`<div class="card" data-id="${v.id}"><div class="th" data-act="open">${th}<span class="dur" data-d="${v.id}">${v.type==="youtube"||v.type==="direct"?"":typeLbl[v.type]}</span><div class="pg"><b style="width:${pr}%"></b></div></div>
<div class="meta"><div class="av" style="background:hsl(${[...(v.channel||"x")].reduce((a,c)=>a+c.charCodeAt(0),0)%360},55%,42%)">${esc((v.channel||"V")[0])}</div><div style="min-width:0"><div class="ttl">${esc(v.title)}</div><div class="st">${esc(v.channel||"Video Player")} • ${kfmt(vwCount(v.id))} views • ${dshort(v.ts)}</div></div></div>
<div class="acts"><button class="lk ${liked?"on":""}" data-act="like">${IC.like}${kfmt(lkCount(v.id))}</button><button data-act="cm">${IC.cm}</button>${isM()?`<button data-act="del" style="color:#ff6b6b;margin-left:auto">${IC.del}</button>`:""}</div></div>`}).join("");
  f.querySelectorAll(".th video").forEach(el=>el.addEventListener("loadedmetadata",()=>{const d=f.querySelector(`[data-d="${el.closest(".card").dataset.id}"]`);if(d&&isFinite(el.duration))d.textContent=dur(el.duration)}));
}
$("feed").onclick=e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const id=b.closest(".card").dataset.id,a=b.dataset.act;
  if(a==="open")openVideo(id);
  else if(a==="like")toggleLike(id);
  else if(a==="cm")toast("Comments are turned off");
  else if(a==="del"&&isM()&&confirm("Delete this video for everyone?"))remove(ref(db,"videos/"+id)).then(()=>{remove(ref(db,"likes/"+id))}).catch(()=>toast("Delete failed"));
};
function toggleLike(id){const r=ref(db,`likes/${id}/${S.user}`);(S.likes[id]&&S.likes[id][S.user]?remove(r):set(r,true)).catch(()=>toast("Could not update like"))}

/* ---------- player ---------- */
let AD=null,iv=null,ytP=null;
function stopPlayer(){
  clearInterval(iv);iv=null;
  try{ytP&&ytP.destroy&&ytP.destroy()}catch(e){}ytP=null;AD=null;
  const pw=$("pw");const v=pw.querySelector("video");if(v){try{v.pause()}catch(e){}}pw.innerHTML="";$("ctl").style.display="none";
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
}
let ytLoad;const loadYT=()=>ytLoad||(ytLoad=new Promise(r=>{if(window.YT&&YT.Player)return r();const s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";window.onYouTubeIframeAPIReady=r;document.head.appendChild(s)}));
function openVideo(id){
  const v=S.videos[id];if(!v)return;
  S.cur=id;go("player");
  const t=Date.now();
  push(ref(db,"views"),{user:S.user,vid:id,title:v.title,ts:t,label:fmt(t)}).catch(()=>{});
  renderPinfo();stopPlayer();
  const pw=$("pw");
  if(v.type==="instagram"){pw.innerHTML=`<iframe src="${esc(igEmbed(v.url))}" allowfullscreen allow="autoplay;encrypted-media;fullscreen"></iframe>`;return}
  if(v.type==="facebook"){pw.innerHTML=`<iframe src="${esc(fbEmbed(v.url))}" allowfullscreen allow="autoplay;clipboard-write;encrypted-media;picture-in-picture;web-share;fullscreen"></iframe>`;return}
  $("ctl").style.display="flex";
  if(v.type==="direct"){
    pw.innerHTML=`<video playsinline autoplay src="${esc(v.url)}"></video><div class="tap"></div>`;
    const el=pw.querySelector("video");
    AD={play:()=>el.play(),pause:()=>el.pause(),seek:x=>el.currentTime=x,time:()=>el.currentTime,dur:()=>el.duration||0,mute:m=>el.muted=m,rate:r=>el.playbackRate=r,playing:()=>!el.paused,muted:()=>el.muted};
    el.onerror=()=>toast("Cannot play this link");
    resume(id);bindCtl(id);
  }else{
    pw.innerHTML=`<div id="yt"></div><div class="tap"></div>`;
    loadYT().then(()=>{
      if(S.cur!==id)return;
      ytP=new YT.Player("yt",{videoId:v.vid,playerVars:{controls:0,playsinline:1,rel:0,modestbranding:1,autoplay:1,fs:0,iv_load_policy:3},events:{
        onReady:()=>{if(S.cur!==id||!ytP)return;AD={play:()=>ytP.playVideo(),pause:()=>ytP.pauseVideo(),seek:x=>ytP.seekTo(x,true),time:()=>ytP.getCurrentTime(),dur:()=>ytP.getDuration(),mute:m=>m?ytP.mute():ytP.unMute(),rate:r=>ytP.setPlaybackRate(r),playing:()=>ytP.getPlayerState()===1,muted:()=>ytP.isMuted()};
          const sp=prog(id);if(sp>0&&sp<.97){const d=ytP.getDuration();if(d)ytP.seekTo(sp*d,true)}
          bindCtl(id);ytP.playVideo()},
        onError:()=>toast("This video cannot be played here")}})});
  }
}
function resume(id){const el=$("pw").querySelector("video"),sp=prog(id);el.addEventListener("loadedmetadata",()=>{if(sp>0&&sp<.97)el.currentTime=sp*el.duration},{once:true})}
let rates=[.5,1,1.25,1.5,2],ri=1;
function bindCtl(id){
  ri=1;$("c-sp").textContent="1x";let seeking=false;
  const up=()=>{if(!AD)return;const d=AD.dur(),t=AD.time();
    $("c-pp").innerHTML=AD.playing()?IC.pause:IC.play;$("c-mu").innerHTML=AD.muted()?IC.mute:IC.vol;
    if(d){if(!seeking)$("sk").value=Math.round(t/d*1000);$("tm").textContent=dur(t)+" / "+dur(d);
      const f=Math.min(1,t/d);localStorage.setItem(`vp_p_${S.user}_${id}`,f);
      const dd=document.querySelector(`[data-d="${id}"]`);if(dd&&!dd.textContent)dd.textContent=dur(d);
      const pb=document.querySelector(`.card[data-id="${id}"] .pg b`);if(pb)pb.style.width=f*100+"%"}};
  clearInterval(iv);iv=setInterval(up,400);up();
  const sk=$("sk");
  sk.oninput=()=>{seeking=true;const d=AD&&AD.dur();if(d)$("tm").textContent=dur(sk.value/1000*d)+" / "+dur(d)};
  sk.onchange=()=>{const d=AD&&AD.dur();if(d)AD.seek(sk.value/1000*d);seeking=false};
  const tog=()=>{if(!AD)return;AD.playing()?AD.pause():AD.play();setTimeout(up,150)};
  $("c-pp").onclick=tog;$("pw").querySelector(".tap").onclick=tog;
  $("c-rw").onclick=()=>AD&&AD.seek(Math.max(0,AD.time()-10));
  $("c-ff").onclick=()=>AD&&AD.seek(Math.min(AD.dur()||1e9,AD.time()+10));
  $("c-mu").onclick=()=>{if(!AD)return;AD.mute(!AD.muted());setTimeout(up,100)};
  $("c-sp").onclick=()=>{ri=(ri+1)%rates.length;AD&&AD.rate(rates[ri]);$("c-sp").textContent=rates[ri]+"x"};
  $("c-fs").onclick=()=>{const w=$("pw");document.fullscreenElement?document.exitFullscreen():(w.requestFullscreen||w.webkitRequestFullscreen||(()=>{})).call(w)};
}
function renderPinfo(){
  const v=S.videos[S.cur];if(!v)return;
  const liked=!!(S.likes[S.cur]&&S.likes[S.cur][S.user]);
  $("pinfo").innerHTML=`<h2>${esc(v.title)}</h2><div class="st">${esc(v.channel||"Video Player")} • ${kfmt(vwCount(S.cur))} views • ${dshort(v.ts)}</div>
<div class="acts"><button class="lk ${liked?"on":""}" id="plk">${IC.like}${kfmt(lkCount(S.cur))}</button><button id="pcm">${IC.cm}</button>${v.type==="instagram"||v.type==="facebook"?`<span style="color:var(--mu);font-size:12px;align-self:center">Controls are provided by ${typeLbl[v.type]}</span>`:""}</div>`;
  $("plk").onclick=()=>toggleLike(S.cur);$("pcm").onclick=()=>toast("Comments are turned off");
}

/* ---------- add video ---------- */
$("aok").onclick=async()=>{
  const url=$("au").value.trim();let title=$("at").value.trim();$("ae").textContent="";
  if(!/^https?:\/\//i.test(url)){$("ae").textContent="Enter a full link starting with http:// or https://";return}
  const pr=parse(url);let channel=typeLbl[pr.type]==="Video"?"Direct video":typeLbl[pr.type];
  $("aok").textContent="Adding...";
  if(pr.type==="youtube"){try{const r=await fetch("https://noembed.com/embed?url="+encodeURIComponent(url));const j=await r.json();if(j.title&&!title)title=j.title;if(j.author_name)channel=j.author_name}catch(e){}}
  if(!title)title=pr.type==="direct"?decodeURIComponent((url.split("?")[0].split("/").pop()||"Video")):typeLbl[pr.type]+" video";
  try{await push(ref(db,"videos"),{url,type:pr.type,vid:pr.id||null,title,channel,by:S.user,ts:Date.now()});history.back();toast("Video added")}
  catch(e){$("ae").textContent="Could not save. Check database rules."}
  $("aok").textContent="Add video";
};

/* ---------- manager ---------- */
function renderMe(){$("mename").textContent=S.user||"";$("merole").textContent=isM()?"Manager":"User";$("mgr").style.display=$("mlogs").style.display=isM()?"":"none"}
$("mgr").onclick=()=>go("mgr");$("mlogs").onclick=()=>go("logs");$("nlogs").onclick=()=>go("logs");
function renderMgr(){
  const us=Object.entries(S.users).sort((a,b)=>(a[1].createdAt||0)-(b[1].createdAt||0));
  $("ulist").innerHTML=`<div class="row"><span class="av">${MGR[0]}</span><div class="g"><div class="n">${MGR}</div><div class="s">Manager (permanent)</div></div></div>`+
  us.map(([n,u])=>`<div class="row"><span class="av">${esc(n[0])}</span><div class="g"><div class="n">${esc(n)}</div><div class="s">Password: ${esc(u.password)}</div></div><button class="x" data-u="${esc(n)}" aria-label="Remove">${IC.del}</button></div>`).join("");
}
$("ulist").onclick=e=>{const b=e.target.closest("[data-u]");if(!b||!isM())return;const n=b.dataset.u;
  if(confirm(`Remove user "${n}"?`))remove(ref(db,"users/"+n)).catch(()=>toast("Remove failed"))};
$("nadd").onclick=async()=>{
  if(!isM())return;const u=$("nu").value.trim(),p=$("np").value;$("me2").textContent="";
  if(!u||!p){$("me2").textContent="Enter username and password.";return}
  if(/[.#$\[\]\/\s]/.test(u)){$("me2").textContent="Username cannot contain spaces or . # $ [ ] /";return}
  if(u.toLowerCase()===MGR||S.users[u]){$("me2").textContent="That username already exists.";return}
  try{await set(ref(db,"users/"+u),{password:p,createdAt:Date.now()});$("nu").value="";$("np").value="";toast("User created")}
  catch(e){$("me2").textContent="Could not save. Check database rules."}
};
$("nall").onclick=()=>{if(isM()&&confirm("Remove ALL users? zamir stays."))remove(ref(db,"users")).then(()=>toast("All users removed")).catch(()=>toast("Remove failed"))};

/* ---------- logs ---------- */
function renderLogs(){
  const L=Object.values(S.views).sort((a,b)=>b.ts-a.ts);
  if(!isM()){$("logs").innerHTML='<div class="empty">Only the manager can view history.</div>';return}
  $("logs").innerHTML=L.length?L.map(l=>`<div class="lgrow"><span class="av">${esc((l.user||"?")[0])}</span><div style="min-width:0"><div class="n" style="font-weight:600">${esc(l.user)}</div><div class="ttl" style="font-size:13px;color:#ddd">${esc(l.title)}</div><div class="tmx">${esc(l.label||fmt(l.ts))}</div></div></div>`).join(""):'<div class="empty">No views yet.</div>';
}

/* ---------- start ---------- */
$("bell").onclick=()=>toast("No new notifications");
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
applySession();
</script>
</body>
</html>
